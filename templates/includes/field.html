{% load ui %}<div class="field-group"><label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}{% if field.field.required %}<span class="required-mark" aria-hidden="true"> *</span>{% endif %}</label>
{% styled_field field %}
{% if field.help_text %}<div class="form-text" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
{% if field.errors %}<div class="invalid-feedback d-block" id="{{ field.auto_id }}_errors">{% for error in field.errors %}<div>{{ error }}</div>{% endfor %}</div>{% endif %}</div>
