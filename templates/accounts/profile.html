{% extends 'base.html' %}{% block content %}<h1>My profile</h1><dl>
<dt>Name</dt><dd>{{ user.get_full_name }}</dd><dt>Username</dt><dd>{{ user.username }}</dd>
<dt>Email</dt><dd>{{ user.email }}</dd><dt>Contact number</dt><dd>{{ user.contact_number }}</dd>
<dt>Location</dt><dd>{{ user.location }}</dd><dt>Role</dt><dd>{{ user.get_role_display }}</dd></dl>
<a class="button" href="{% url 'profile_edit' %}">Edit my profile</a>{% endblock %}
