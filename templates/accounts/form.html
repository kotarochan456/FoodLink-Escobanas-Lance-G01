{% extends 'base.html' %}{% block content %}<h1>{{ title }}</h1>
<p>All fields are required.</p><form method="post" class="account-form">{% csrf_token %}{{ form.as_p }}<button>{{ button }}</button></form>
{% if user.is_authenticated %}<p><a href="{% url 'profile' %}">Cancel</a></p>{% else %}<p>Already registered? <a href="{% url 'login' %}">Log in</a></p>{% endif %}{% endblock %}
